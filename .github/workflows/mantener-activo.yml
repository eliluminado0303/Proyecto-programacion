# Hace una llamada a la base de datos cada 3 días para que Supabase (plan gratis)
# NO pause el proyecto por inactividad. Requiere 2 "secrets" en GitHub:
#   SUPABASE_URL  y  SUPABASE_KEY  (los mismos valores públicos del .env)
name: Mantener Supabase activo
on:
  schedule:
    - cron: "17 9 */3 * *"
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a catalogo()
        run: |
          curl --fail --silent --show-error --max-time 30 -X POST \
            "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/catalogo" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
            -H "Content-Type: application/json" -d '{}' > /dev/null
          echo "OK"
